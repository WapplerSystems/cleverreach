name: TER release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re-)publish to TER (e.g. 12.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ter-release
  cancel-in-progress: false

jobs:
  ter-release:
    name: Publish to TER
    runs-on: ubuntu-latest
    env:
      TYPO3_EXTENSION_KEY: cleverreach
      REPOSITORY_URL: https://github.com/WapplerSystems/cleverreach
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

    steps:
      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, xml, zip, curl
          tools: composer:v2

      - name: Install typo3/tailor
        run: |
          composer global require --no-progress typo3/tailor:^1.6
          echo "$(composer -q global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Publish ${{ steps.version.outputs.version }} to TER
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tailor ter:publish \
            --artefact "${REPOSITORY_URL}/archive/${VERSION}.zip" \
            --comment "Released version ${VERSION} of EXT:${TYPO3_EXTENSION_KEY}. See ${REPOSITORY_URL}/releases/tag/${VERSION} for details." \
            "${VERSION}"
