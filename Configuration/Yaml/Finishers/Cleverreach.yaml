                    templateName: 'Inspector-TextEditor'
                    propertyPath: 'options.oauthClient'
                    label: 'OAuth Client'
                  400:
                    identifier: 'groupId'
                    templateName: 'Inspector-TextEditor'
                    propertyPath: 'options.groupId'
                    label: 'Group'
                  500:
                    identifier: 'formId'
                    templateName: 'Inspector-TextEditor'
