<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">
    <h1>CleverReach OAuth</h1>

    <f:if condition="{isConnected}">
        <f:then>
            <p>Der CleverReach-Account ist verbunden.</p>
            <h2>Account-Info</h2>
            <pre>
                <f:for each="{accountInfo}" key="key" as="data">
{key}: {data}
                </f:for>
            </pre>
        </f:then>
        <f:else>
            <p>{message}</p>
            <p>Beim Aufruf des Moduls wird automatisch zur CleverReach-Anmeldung umgeleitet,
                wenn noch kein oder ein ungültiger Token vorhanden ist.</p>
        </f:else>
    </f:if>
</f:section>
</html>
